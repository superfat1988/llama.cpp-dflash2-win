name: TurboQuant Windows CUDA 12.4

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "feature/turboquant-kv-cache"
        type: string
  push:
    tags:
      - "tqp-win-cuda12.4-v*"

permissions:
  contents: read

concurrency:
  group: tqp-windows-cuda12.4-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON"

jobs:
  windows-cuda:
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            %CMAKE_ARGS%
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item LICENSE .\build\bin\Release\
          $dst = '.\build\bin\Release\'
          $patterns = @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')
          $sources = @("${env:CUDA_PATH}\bin", "${env:CUDA_PATH}\bin\x64", "${env:CUDA_PATH}\lib")
          foreach ($source in $sources) {
            if (Test-Path $source) {
              foreach ($pattern in $patterns) {
                Get-ChildItem -Path $source -Filter $pattern -ErrorAction SilentlyContinue | Copy-Item -Destination $dst -Force
              }
            }
          }
          $archive = "turboquant-windows-x64-cuda12.4-${{ github.run_number }}.zip"
          Compress-Archive -Path .\build\bin\Release\* -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify package
        shell: pwsh
        run: |
          Expand-Archive -Path $env:ARCHIVE -DestinationPath verify
          $entries = Get-ChildItem -Path verify -File -Recurse | Select-Object -ExpandProperty FullName
          $required = @('llama-server.exe', 'cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')
          foreach ($pattern in $required) {
            if (-not ($entries | Where-Object { $_ -like "*$pattern" })) {
              throw "Missing required package entry: $pattern"
            }
          }

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: turboquant-windows-x64-cuda12.4
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

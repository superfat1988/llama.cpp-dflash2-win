name: DFlash2 Windows CUDA Build

on:
  push:
    branches: [dflash2-win-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install CUDA Toolkit
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda-network.exe'
          Invoke-WebRequest -Uri 'https://developer.download.nvidia.com/compute/cuda/12.4.1/network_installers/cuda_12.4.1_windows_network.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '-s', 'nvcc_12.4', 'cudart_12.4', 'cublas_12.4', 'cublas_dev_12.4' -Wait -NoNewWindow
          $cuda = Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cuda) { throw 'CUDA Toolkit installation not found' }
          "CUDA_PATH=$($cuda.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($cuda.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$($cuda.FullName)\bin\nvcc.exe" --version
      - name: Configure CUDA build
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DGGML_CUDA=ON -DCUDAToolkit_ROOT="$env:CUDA_PATH" -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" -DCMAKE_CUDA_ARCHITECTURES=86 -DCMAKE_BUILD_TYPE=Release
      - name: Build llama-server
        shell: pwsh
        run: cmake --build build -j 2
      - name: Package runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/bin/* package/ -Force
          $cudaDlls = @(
            'cudart64_12.dll',
            'cublas64_12.dll',
            'cublasLt64_12.dll'
          )
          foreach ($dll in $cudaDlls) {
            $source = Join-Path "$env:CUDA_PATH\bin" $dll
            if (-not (Test-Path $source)) { throw "Required CUDA runtime DLL missing: $source" }
            Copy-Item $source package/ -Force
          }
          Get-ChildItem package | Select-Object Name,Length
          "Package size: $([math]::Round(((Get-ChildItem package -File | Measure-Object Length -Sum).Sum / 1MB), 1)) MiB"
      - uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cuda-dflash2-pr27342-complete-runtime
          path: package/
          if-no-files-found: error
          retention-days: 7

name: DFlash2 Windows CUDA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure CUDA build
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build llama-server
        shell: pwsh
        run: cmake --build build --config Release --target llama-server -j 2
      - name: Package runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/bin/Release/* package/ -Force
          Get-ChildItem package | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda-dflash2-pr27342
          path: package/
          if-no-files-found: error
          retention-days: 7
